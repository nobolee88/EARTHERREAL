# ============================================================================
# QUANTA NETWORK GATEWAY - Ansible Hosts Inventory
# ============================================================================
#
# Define your server(s) here
#
# For a single server:
#   Replace YOUR_SERVER_IP with your VPS IP address
#   Replace ~/.ssh/id_rsa with your SSH key path
#
# For multiple servers (high availability):
#   Add more servers under [quanta_servers]
#
# ============================================================================

[quanta_servers]
# Production server
quanta-prod ansible_host=YOUR_SERVER_IP ansible_user=root ansible_ssh_private_key_file=~/.ssh/id_rsa

# Optional: Backup/HA server
# quanta-backup ansible_host=BACKUP_SERVER_IP ansible_user=root ansible_ssh_private_key_file=~/.ssh/id_rsa

[quanta_servers:vars]
# Global variables for all servers
ansible_python_interpreter=/usr/bin/python3

